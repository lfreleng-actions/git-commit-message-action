# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: 'Test local GitHub Action'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        name: 'Harden runner'
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 5  # Ensure we have enough commits for testing

      - name: 'Setup test commits'
        shell: bash
        run: |
          # Create test commits with different message formats
          git config user.name 'Test User'
          git config user.email 'test@example.com'

          # Create a commit with DCO and Change-Id
          echo 'test-file-1' > test1.txt
          git add test1.txt
          git commit -m 'feat: Add test feature

          This commit includes both DCO and Change-Id.

          Change-Id: I1234567890abcdef1234567890abcdef12345678
          Signed-off-by: Test User <test@example.com>'

      - name: 'Test default behavior (latest commit)'
        id: test_default
        uses: ./

      - name: 'Validate default test outputs'
        shell: bash
        run: |
          if [ -z "${STEPS_TEST_DEFAULT_OUTPUTS_COMMIT_SHA}" ]; then
            echo "❌ commit_sha is empty"
            exit 1
          fi

          if [ -z "${STEPS_TEST_DEFAULT_OUTPUTS_COMMIT_MESSAGE}" ]; then
            echo "❌ commit_message is empty"
            exit 1
          fi

          echo "✅ Default test passed"
          echo "SHA: ${STEPS_TEST_DEFAULT_OUTPUTS_COMMIT_SHA}"
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_DEFAULT_OUTPUTS_COMMIT_SHA: ${{ steps.test_default.outputs.commit_sha }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_DEFAULT_OUTPUTS_COMMIT_MESSAGE: ${{ steps.test_default.outputs.commit_message }}

      - name: "Test specific commit number"
        id: test_commit_2
        uses: ./
        with:
          commit_number: "2"

      - name: "Validate specific commit test"
        shell: bash
        run: |
          if [ -z "${STEPS_TEST_COMMIT_2_OUTPUTS_COMMIT_SHA}" ]; then
            echo "❌ Second commit SHA is empty"
            exit 1
          fi

          # Should be different from first commit
          if [ "${STEPS_TEST_DEFAULT_OUTPUTS_COMMIT_SHA}" = \
               "${STEPS_TEST_COMMIT_2_OUTPUTS_COMMIT_SHA}" ]; then
            echo "❌ Commit SHAs should be different"
            exit 1
          fi

          echo '✅ Specific commit test passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_COMMIT_2_OUTPUTS_COMMIT_SHA: ${{ steps.test_commit_2.outputs.commit_sha }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_DEFAULT_OUTPUTS_COMMIT_SHA: ${{ steps.test_default.outputs.commit_sha }}

      - name: "Test DCO and Change-Id detection"
        shell: bash
        run: |
          # Test DCO detection
          if [ "${STEPS_TEST_DEFAULT_OUTPUTS_DCO_SIGNED_OFF}" != \
               'true' ]; then
            echo '❌ DCO not detected in latest commit'
            exit 1
          fi

          if [ "${STEPS_TEST_DEFAULT_OUTPUTS_DCO_NAME}" != \
               'Test User' ]; then
            echo '❌ DCO name not extracted correctly'
            echo 'Expected: Test User'
            echo "Got: ${STEPS_TEST_DEFAULT_OUTPUTS_DCO_NAME}"
            exit 1
          fi

          if [ "${STEPS_TEST_DEFAULT_OUTPUTS_DCO_EMAIL}" != \
               'test@example.com' ]; then
            echo '❌ DCO email not extracted correctly'
            exit 1
          fi

          # Test Change-Id detection
          if [ "${STEPS_TEST_DEFAULT_OUTPUTS_CHANGE_ID}" != \
               'true' ]; then
            echo '❌ Change-Id not detected'
            exit 1
          fi

          expected_change_id='I1234567890abcdef1234567890abcdef12345678'
          if [ "${STEPS_TEST_DEFAULT_OUTPUTS_CHANGE_ID_VALUE}" != \
               "$expected_change_id" ]; then
            echo '❌ Change-Id value not extracted correctly'
            exit 1
          fi

          echo '✅ DCO and Change-Id detection tests passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_DEFAULT_OUTPUTS_DCO_SIGNED_OFF: ${{ steps.test_default.outputs.dco_signed_off }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_DEFAULT_OUTPUTS_DCO_NAME: ${{ steps.test_default.outputs.dco_name }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_DEFAULT_OUTPUTS_DCO_EMAIL: ${{ steps.test_default.outputs.dco_email }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_DEFAULT_OUTPUTS_CHANGE_ID: ${{ steps.test_default.outputs.change_id }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_DEFAULT_OUTPUTS_CHANGE_ID_VALUE: ${{ steps.test_default.outputs.change_id_value }}

      - name: 'Test invalid commit number (should fail)'
        id: test_invalid
        uses: ./
        continue-on-error: true
        with:
          commit_number: 'abc'

      - name: 'Validate error handling'
        shell: bash
        run: |
          if [ "${STEPS_TEST_INVALID_OUTCOME}" = "success" ]; then
            echo '❌ Action should have failed with invalid input'
            exit 1
          fi

          echo '✅ Error handling test passed'
        env:
          STEPS_TEST_INVALID_OUTCOME: ${{ steps.test_invalid.outcome }}

      - name: 'Test commit without DCO or Change-Id'
        shell: bash
        run: |
          # Create commit without DCO or Change-Id
          echo 'test-file-2' > test2.txt
          git add test2.txt
          git commit -m 'Simple commit without DCO or Change-Id'

      - name: 'Test missing DCO and Change-Id'
        id: test_no_dco
        uses: ./

      - name: 'Validate missing DCO/Change-Id detection'
        shell: bash
        run: |
          if [ "${STEPS_TEST_NO_DCO_OUTPUTS_DCO_SIGNED_OFF}" != \
               'false' ]; then
            echo '❌ Should detect missing DCO'
            exit 1
          fi

          if [ "${STEPS_TEST_NO_DCO_OUTPUTS_CHANGE_ID}" != \
               'false' ]; then
            echo '❌ Should detect missing Change-Id'
            exit 1
          fi

          echo '✅ Missing DCO/Change-Id detection passed'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_NO_DCO_OUTPUTS_DCO_SIGNED_OFF: ${{ steps.test_no_dco.outputs.dco_signed_off }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_NO_DCO_OUTPUTS_CHANGE_ID: ${{ steps.test_no_dco.outputs.change_id }}

      - name: 'Test summary'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 🧪 Action Test Results
          - ✅ Default behavior test
          - ✅ Specific commit number test
          - ✅ DCO and Change-Id detection
          - ✅ Error handling test
          - ✅ Missing DCO/Change-Id detection

          All tests completed successfully! 🎉
          EOF
